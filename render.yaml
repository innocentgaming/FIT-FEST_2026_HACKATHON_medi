# Render.com Blueprint for 1-Click Free Deployment
services:
  - type: web
    name: medilink-care
    env: node
    plan: free
    buildCommand: npm run build:all
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
